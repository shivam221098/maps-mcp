name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the tool call and provider. Do not paste API keys.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: maps-mcp version, Python version, OS, MCP client
