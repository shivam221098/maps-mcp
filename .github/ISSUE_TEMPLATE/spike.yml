name: Spike
description: Time-boxed research that ends with a written outcome
title: "[Spike] "
labels: ["spike"]
body:
  - type: input
    id: epic
    attributes:
      label: Parent epic
      description: Issue number of the epic, e.g. `#12`
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      description: e.g. "1 day"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What written output closes this spike (comparison table, ADR, prototype)?
    validations:
      required: true
